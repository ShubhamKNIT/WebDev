<!DOCTYPE html>
<html>

<head>
  <title>Chatbot</title>
</head>

<body>
  <div class="js-container"></div>
  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.js"></script>
  <script type="text/babel">
    
    // 2b
    function Button ({ text }) {
      return (
        <button>{text}</button>
      );
    }

    // 2c
    function Input ({ placeholder }) {
      return (
        <div>
          <input placeholder={placeholder}/>
        </div>
      );
    }
    
    // 2d
    function LoginForm() {
      return (
        <div>
          <p>Hello, welcome to my website</p>
          <Input placeholder="Email" />
          <Input placeholder="Password" />
          <Button text="Login" />
          <Button text="Sign Up" />
        </div>
      );
    }

    // 2e
    function ProductDetails({ name, price, discount }) {
      const discountPrice = (discount) ? price * (100 - discount)/100 : 0;
      const _price = <p>Price: ${price}</p>
      return (
        <div>
          <p>{name}</p>
          {discount ? <del>{_price}</del> : _price}
          {discount && <p>Discounted Price: ${discountPrice}</p>}
          <Button text="Add to Cart" />
        </div>
      );
    }

    function App () {
      // <LoginForm />
      return (
        <>
          <ProductDetails name="Socks" price="0.4"/>
          <ProductDetails name="Tennis Ball" price="2.0" discount="8"/>
        </>
      );
    }

    const container = document.querySelector('.js-container');
    const root = ReactDOM.createRoot(container);
    root.render(
      <App />
    );
  </script>
</body>

</html>
