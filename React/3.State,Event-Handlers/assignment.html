    function Input({ inputText, setInputText }) {

      function updateText(event) {
        setInputText(event.target.value);
      }

      return (
        <>
          <input 
            placeholder="Enter a text"
            type="text"
            value={inputText}
            onChange={updateText}
          />

          <p>{inputText}</p>
        </>
      );
    }

    function ResetButton({ setInputText }) {
      function resetText(event) {
        setInputText("");
      }

      return (
        <>
          <button onClick={resetText}>Reset</button>
        </>
      );
    }

    function ExampleButton({ flag, setFlag }) {
      function toggleExample() {
        setFlag(!flag);
      }

      return (
        <>
          <button onClick={toggleExample}>Example</button>
          {flag === true && <p>Alice</p>}
        </>
      );
    }
