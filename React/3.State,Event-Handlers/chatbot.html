  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.js"></script>
  <script type="text/babel">

    function ChatInput({ chatMessages, setChatMessages, loading, setLoading }) {
      const [inputText, setInputText] = React.useState('');

      function saveInputText(event) {
        setInputText(event.target.value);
      }

      function checkEscape(event) {
        // console.log(event.key);
        if (event.key == "Escape") {
          setInputText("");
        }
      }


      async function sendMessage() {
        if (loading || inputText === "") return;

        const text = inputText;
        setInputText("");
        setLoading(true);

        const newChatMessages = [
          ...chatMessages, // spread operator => to copy the old data
          {
            sender: "user",
            message: text,
            id: crypto.randomUUID()
          }
        ];

        setChatMessages(newChatMessages);

        // getResponse
        const response = await Chatbot.getResponseAsync(text);

        // console.log(response);
        setChatMessages([
          ...newChatMessages, // spread operator => to copy the old data
          {
            sender: "robot",
            message: response,
            id: crypto.randomUUID()
          }
        ]);

        setInputText(""); // set input to empty after button click
        setLoading(false);
      }

      return (
        <>
          <input 
            placeholder="Send a message to Chatbot"
            size="30"
            value={inputText}
            onChange={saveInputText}
            onKeyDown={checkEscape}
          />
          <button onClick={sendMessage} disabled={loading}>Send</button>
        </>
      );
    }

    function ChatMessage({ sender, message }) {
      return (
        <div>
          {(sender === 'robot') && <img src="../Assets/robot.png" alt="robot image" width="50" />}
          {message}
          {(sender === 'user') && <img src="../Assets/user.png" alt="user image" width="50" />}
        </div>
      );
    }

    function App () {
      // messages array
      // useState has two values in array => current state/value, updateState function
      const array = React.useState([{
