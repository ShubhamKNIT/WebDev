<!DOCTYPE html>
<html>

<head>
  <title>Chatbot</title>
  <style>
    .body {
      font-family: Arial, Helvetica, sans-serif;
      margin-top: 0px;
      margin-bottom: 0px;
    }

    .send-button {
      background-color: rgb(25, 135, 84);
      color: white;
      padding: 12px 20px;
      margin-left: 10px;
      border: none;
      border-radius: 10px;
      font-size:15px;
      cursor: pointer;
    }

    .chat-input {
      padding: 12px 15px;
      border-radius: 10px;
      border-width: 1px;
      font-size: 15px;
      flex-grow: 1;
    }

    .chat-input-container {
      display: flex;
      margin-bottom: 60px;
    }

    .app-container {
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .chat-message-user {
      display: flex;
      justify-content: end;
      align-items: start;
    }

    .chat-message-robot {
      display: flex;
      align-items: start;
    }

    .chat-message-text {
      background-color: rgb(238, 238, 238);
      padding: 15px 20px;
      border-radius: 10px;
      margin: 0px 10px 20px 10px;
      max-width: 300px;
    }

    .chat-message-profile {
      width: 50px;
    }

    .chat-messages-container {
      flex-grow: 1;
      margin-top: 20px;
      overflow: scroll;
      scrollbar-width: none;
    }

  </style>
</head>

<body>
  <div class="js-container"></div>
  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.js"></script>
  <script src="https://unpkg.com/supersimpledev@8.0.1/chatbot.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/async/3.2.6/async.min.js" integrity="sha512-Ps4UroO9GAII8QTM2IE4KcHjslTEZjoZY6OhztAFKSnnqshNnPR8PQl1usQpGiHQXnyRCwEMZAsVJgGg2z8Kog==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.js"></script>
  <script type="text/babel">

    function ChatInput({ chatMessages, setChatMessages, loading, setLoading }) {
      const [inputText, setInputText] = React.useState('');

      function saveInputText(event) {
        setInputText(event.target.value);
      }

      function checkEscape(event) {
        // console.log(event.key);
        if (event.key == "Escape") {
          setInputText("");
        }
      }


      async function sendMessage() {
        if (loading || inputText === "") return;

        const text = inputText;
        setInputText("");
        setLoading(true);

        const newChatMessages = [
          ...chatMessages, // spread operator => to copy the old data
          {
            sender: "user",
            message: text,
            id: crypto.randomUUID()
          }
        ];

        setChatMessages(newChatMessages);

        // getResponse
        const response = await Chatbot.getResponseAsync(text);

        // console.log(response);
        setChatMessages([
          ...newChatMessages, // spread operator => to copy the old data
          {
            sender: "robot",
            message: response,
            id: crypto.randomUUID()
          }
        ]);

        setInputText(""); // set input to empty after button click
        setLoading(false);
      }

      return (
        <div className="chat-input-container">
          <input 
            placeholder="Send a message to Chatbot"
            size="30"
            value={inputText}
            onChange={saveInputText}
            onKeyDown={checkEscape}
            className="chat-input"
          />
          <button 
            onClick={sendMessage} 
            disabled={loading}
            className="send-button"
          >Send</button>
        </div>
      );
    }

    function ChatMessage({ sender, message }) {
      return (
        <div className={
          sender === "user"
          ? "chat-message-user"
          : "chat-message-robot"
        }>
          {(sender === 'robot') && (
            <img src="../Assets/robot.png" alt="robot image" className="chat-message-profile {
              width: 50px;
            }" />
          )}
          <div className="chat-message-text">
            {message}
          </div>
          {(sender === 'user') && (
            <img src="../Assets/user.png" alt="user image" className="chat-message-profile {
              width: 50px;
            }" />
          )}
        </div>
      );
    }

    function ChatMessages({ chatMessages }) {
      const chatMessagesRef = React.useRef(null); // this is used to save html element for future use

      React.useEffect(() => {
        // here we can run some code after the component is created/updated
        // console.log("updated");
        const containerElem = chatMessagesRef.current;
        if (containerElem) {
          containerElem.scrollTop = containerElem.scrollHeight;
        }
      }, [chatMessages]); // array controls when useEffect runs and also we can put some data in this array

      return (
        <div 
          className="chat-messages-container"
          ref={chatMessagesRef}>
          {
            chatMessages.map((chatMessage) => {
              return (
                <ChatMessage 
                  sender = {chatMessage.sender}
                  message = {chatMessage.message}
                  key={chatMessage.id}
                />
              );
            })
          }
        </div>
      );
    }

    function App () {
      // messages array
      const [chatMessages, setChatMessages] = React.useState([{
        sender: "user",
        message: "hello chatbot",
        id: crypto.randomUUID()
      }, {
        sender: "robot",
        message: "Hi, Let me know how I can help!",
        id: crypto.randomUUID()
      }, {
        sender: "user",
        message: "hello chatbot",
        id: crypto.randomUUID()
      }, {
        sender: "robot",
        message: "Hi, Let me know how I can help!",
        id: crypto.randomUUID()
      }, {
        sender: "user",
        message: "hello chatbot",
        id: crypto.randomUUID()
      }, {
        sender: "robot",
        message: "Hi, Let me know how I can help!",
        id: crypto.randomUUID()
      }, {
        sender: "user",
        message: "hello chatbot",
        id: crypto.randomUUID()
      }, {
        sender: "robot",
        message: "Hi, Let me know how I can help!",
        id: crypto.randomUUID()
      }, {
        sender: "user",
        message: "hello chatbot",
        id: crypto.randomUUID()
      }, {
        sender: "robot",
        message: "Hi, Let me know how I can help!",
        id: crypto.randomUUID()
      }, {
        sender: "user",
        message: "hello chatbot",
        id: crypto.randomUUID()
      }, {
        sender: "robot",
        message: "Hi, Let me know how I can help!",
        id: crypto.randomUUID()
      }]);

      const [loading, setLoading] = React.useState(false);

      return (
        <div className="app-container">
          <ChatMessages 
          chatMessages={chatMessages}
          />
          {loading && 
            <ChatMessage 
            sender="robot"
            message="Thinking..."
            />
          }
          <ChatInput 
            chatMessages={chatMessages}
            setChatMessages={setChatMessages}
            loading={loading}
            setLoading={setLoading}
          />
        </div>
      );
    }

    const container = document.querySelector('.js-container');
    const root = ReactDOM.createRoot(container);
    root.render(
      <App />
    );
  </script>
</body>
</html>

<!-- 0. React Hooks: useState(), useeEffect(), useRef(), ... -->
<!-- 1. When using React, do not use vanilla DOM, because react handles DOM -->
<!-- 2. React hook help in dynamic updation of HTML -->
